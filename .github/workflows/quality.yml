name: Quality checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (baseline debt, non-blocking)
        continue-on-error: true
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
