name: Quality checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (baseline debt, non-blocking)
        continue-on-error: true
        run: npm run lint
      - name: Unit, component and API tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Built SEO and asset checks
        run: npm run test:seo-build
      - name: Archive validated build
        uses: actions/upload-artifact@v4
        with:
          name: france-numerique-energie-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
