name: Verify and deploy frontend

on:
  pull_request:
    branches: [main-prod]
  push:
    branches: [main-prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint without new regressions
        run: npm run lint
      - name: Unit, component and API tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Built SEO and asset checks
        run: npm run test:seo-build
      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Archive validated build
        uses: actions/upload-artifact@v4
        with:
          name: france-numerique-energie-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Archive browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  verify_production:
    name: Verify automatic VPS deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main-prod'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the exact commit and smoke-test production
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: https://hackaton-energie.trauchessec.fr
        run: |
          for attempt in $(seq 1 90); do
            release=$(curl -fsS --max-time 10 "$SITE_URL/release-info.json?sha=$EXPECTED_SHA" || true)
            if printf '%s' "$release" | jq -e --arg sha "$EXPECTED_SHA" '.commit == $sha' >/dev/null 2>&1; then
              curl -fsS --max-time 10 "$SITE_URL/api/health" | jq -e '.status == "ok"' >/dev/null
              curl -fsS --max-time 10 "$SITE_URL/api/geojson/france-regions" | jq -e '.type == "FeatureCollection" and (.features | length) > 0' >/dev/null
              curl -fsS --max-time 10 "$SITE_URL/comprendre-electricite-en-france.html" | grep -F "<h1>Comprendre le parcours de l'électricité en France</h1>" >/dev/null
              echo "Production serves commit $EXPECTED_SHA; API health, regions and guide are healthy."
              exit 0
            fi
            if (( attempt % 6 == 0 )); then
              echo "Waiting for commit $EXPECTED_SHA ($attempt/90 checks)."
            fi
            sleep 10
          done
          echo "Production did not publish commit $EXPECTED_SHA within 15 minutes." >&2
          exit 1
